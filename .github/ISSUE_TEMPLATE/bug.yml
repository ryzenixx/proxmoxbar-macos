name: Bug report
description: Report a problem in ProxmoxBar
labels: [bug]

body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem, what you expected and any error message.
    validations:
      required: true

  - type: input
    attributes:
      label: ProxmoxBar version
      description: Include the build number from Settings and whether you installed from the App Store or downloaded the app.
    validations:
      required: true

  - type: input
    attributes:
      label: macOS version and Mac model
    validations:
      required: true

  - type: input
    attributes:
      label: Proxmox VE version
      description: Include this if the issue involves a server.

  - type: textarea
    attributes:
      label: Screenshots or logs
      description: Remove token secrets and any private addresses before attaching files.
