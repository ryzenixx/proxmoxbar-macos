name: Feature request
description: Suggest a change to ProxmoxBar
labels: [enhancement]

body:
  - type: textarea
    attributes:
      label: What would you like to do?
      description: Describe the task you want to accomplish and where the current app gets in the way.
    validations:
      required: true

  - type: textarea
    attributes:
      label: How could it work?
      description: Share a suggestion or mockup if you have one.
