name: CI

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/SECURITY.md"
  push:
    branches:
      - develop
    paths-ignore:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/SECURITY.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Toolchain Info
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxmoxBar.xcodeproj \
            -scheme ProxmoxBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxmoxBar.xcodeproj \
            -scheme ProxmoxBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            test
