name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check formatting
        run: |
          xcrun swift-format lint --strict --recursive ProxmoxBar ProxmoxBarTests

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project ProxmoxBar.xcodeproj \
            -scheme ProxmoxBar \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            build test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
