name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (example: v3.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: ProxmoxBar
  SPARKLE_TOOLS_VERSION: "2.9.5"
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Tag must match the version in the project
        run: |
          set -euo pipefail
          marketing=$(xcodebuild -project "${APP_NAME}.xcodeproj" -scheme "$APP_NAME" \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ MARKETING_VERSION/ {print $2; exit}')
          expected="v${marketing}"
          echo "tag=${TAG_NAME}  project=${expected}"
          [ "$TAG_NAME" = "$expected" ] || {
            echo "::error::Tag ${TAG_NAME} does not match MARKETING_VERSION ${marketing}"
            exit 1
          }

      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive ProxmoxBar ProxmoxBarWidget ProxmoxBarTests

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project "${APP_NAME}.xcodeproj" -scheme "$APP_NAME" \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build test

  package:
    name: Sign, notarize and package
    runs-on: xcode-27
    needs: verify
    timeout-minutes: 90
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Import signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install provisioning profiles
        env:
          PP_APP: ${{ secrets.MACOS_PROVISION_APP }}
          PP_WIDGET: ${{ secrets.MACOS_PROVISION_WIDGET }}
        run: |
          set -euo pipefail
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          install_profile() {
            local tmp uuid name
            tmp="$(mktemp)"
            printf '%s' "$1" | base64 --decode > "$tmp"
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            name=$(security cms -D -i "$tmp" | plutil -extract Name raw -)
            cp "$tmp" "$dir/$uuid.provisionprofile"
            echo "$2=$name" >> "$GITHUB_ENV"
            echo "installed '$name' ($uuid)"
          }
          install_profile "$PP_APP" APP_PROFILE
          install_profile "$PP_WIDGET" WIDGET_PROFILE

      - name: Archive
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.MACOS_SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          xcodebuild -project "${APP_NAME}.xcodeproj" -scheme "$APP_NAME" \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_KEY" \
            archive

      - name: Export Developer ID build
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          plist="${RUNNER_TEMP}/ExportOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > "$plist"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          pb "Add :method string developer-id"
          pb "Add :signingStyle string manual"
          pb "Add :teamID string ${TEAM_ID}"
          pb "Add :signingCertificate string Developer ID Application"
          pb "Add :provisioningProfiles dict"
          pb "Add :provisioningProfiles:com.proxmoxbar.app string ${APP_PROFILE}"
          pb "Add :provisioningProfiles:com.proxmoxbar.app.ProxmoxBarWidget string ${WIDGET_PROFILE}"
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "${RUNNER_TEMP}/export"

      - name: Re-sign with the hardened runtime and full entitlements
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/export/${APP_NAME}.app"
          appex=$(find "$app/Contents/PlugIns" -name "*.appex" | head -n1)
          resolved="${RUNNER_TEMP}/app.entitlements"
          python3 - "$TEAM_ID" "ProxmoxBar/ProxmoxBar.entitlements" "$resolved" <<'PY'
          import sys
          team, src, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          bundle = "com.proxmoxbar.app"
          text = open(src).read()
          text = text.replace("$(PRODUCT_BUNDLE_IDENTIFIER)", bundle)
          text = text.replace("$(AppIdentifierPrefix)", team + ".")
          text = text.replace("$(CFBundleIdentifier)", bundle)
          open(dst, "w").write(text)
          PY
          codesign --force --options runtime --timestamp \
            --entitlements ProxmoxBarWidget/ProxmoxBarWidget.entitlements \
            --sign "Developer ID Application" "$appex"
          codesign --force --options runtime --timestamp \
            --entitlements "$resolved" \
            --sign "Developer ID Application" "$app"
          codesign --verify --deep --strict "$app"

      - name: Verify the whole bundle is signed by our team
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/export/${APP_NAME}.app"
          codesign --verify --deep --strict "$app"
          appex=$(find "$app/Contents/PlugIns" -type d -name "*.appex" 2>/dev/null | head -n1)
          [ -n "$appex" ] || { echo "::error::widget extension missing from the bundle"; exit 1; }
          while IFS= read -r part; do
            team=$(codesign -dv "$part" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            [ "$team" = "$TEAM_ID" ] || { echo "::error::$part signed by ${team:-nothing}"; exit 1; }
          done < <(find "$app/Contents/Frameworks" "$app/Contents/PlugIns" -type d \
            \( -name "*.framework" -o -name "*.xpc" -o -name "*.app" -o -name "*.appex" \) 2>/dev/null)
          echo "every embedded component is signed by $TEAM_ID"

      - name: Notarize and staple the app
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/notarize.sh "${RUNNER_TEMP}/export/${APP_NAME}.app"

      - name: Build and sign the disk image
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet dmgbuild \
            || python3 -m pip install --quiet --break-system-packages dmgbuild
          dmg="${RUNNER_TEMP}/${APP_NAME}.dmg"
          rm -f "$dmg"
          python3 -m dmgbuild \
            -s installer/dmg_settings.py \
            -D app="${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "$APP_NAME" "$dmg"
          test -f "$dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$dmg"
          codesign --verify --strict "$dmg"

      - name: Notarize and staple the disk image
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/notarize.sh "${RUNNER_TEMP}/${APP_NAME}.dmg"
          spctl -a -t open --context context:primary-signature -v "${RUNNER_TEMP}/${APP_NAME}.dmg"

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/sparkle-tools"
          mkdir -p "$tools"
          curl -fsSL -o "${RUNNER_TEMP}/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          tar -xf "${RUNNER_TEMP}/sparkle.tar.xz" -C "$tools"
          bin="$(find "$tools" -type f -path '*/bin/generate_appcast' | head -n1)"
          [ -x "$bin" ] || { echo "::error::generate_appcast not found"; exit 1; }

          assets="${RUNNER_TEMP}/assets"
          rm -rf "$assets"; mkdir -p "$assets"
          cp "${RUNNER_TEMP}/${APP_NAME}.dmg" "$assets/"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$bin" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --ed-key-file - \
            "$assets"

          version="${TAG_NAME#v}"
          awk -v h="## $version" '$0==h {f=1; next} f && /^## / {exit} f {print}' RELEASE_NOTES.md \
            | sed -e '/./,$!d' > "$assets/release-notes.md"

          notes="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/release-notes.md"
          python3 - "$assets/appcast.xml" "$notes" <<'PY'
          import re, sys
          path, url = sys.argv[1], sys.argv[2]
          xml = open(path).read()
          tag = f"<sparkle:releaseNotesLink>{url}</sparkle:releaseNotesLink>"
          if "<sparkle:releaseNotesLink>" in xml:
              xml = re.sub(r"<sparkle:releaseNotesLink>[^<]*</sparkle:releaseNotesLink>", tag, xml)
          else:
              xml = xml.replace("<enclosure", tag + "\n            <enclosure", 1)
          open(path, "w").write(xml)
          PY
          cat "$assets/appcast.xml"
          shasum -a 256 "${RUNNER_TEMP}/${APP_NAME}.dmg" \
            | sed "s#${RUNNER_TEMP}/##" > "$assets/${APP_NAME}.dmg.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: assets/release-notes.md
          generate_release_notes: true
          files: |
            assets/${{ env.APP_NAME }}.dmg
            assets/${{ env.APP_NAME }}.dmg.sha256
            assets/release-notes.md
          fail_on_unmatched_files: true

      - name: Update the appcast on main
        run: |
          set -euo pipefail
          cp assets/appcast.xml appcast.xml
          if git diff --quiet -- appcast.xml; then
            echo "appcast already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(release): update appcast for ${TAG_NAME}"
          git push origin HEAD:main
