name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (example: v2.0.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: ProxmoxBar
  SPARKLE_TOOLS_VERSION: "2.9.0"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve and Validate Tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: ./scripts/release/preflight.sh

  build_and_test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30
    needs: preflight
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.MACOS_SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout Release Tag
        run: git checkout "refs/tags/$TAG_NAME"

      - name: Build and Test
        run: ./scripts/release/build_and_test.sh

  archive_signed_app:
    name: Archive Signed App
    runs-on: macos-26
    timeout-minutes: 30
    needs:
      - preflight
      - build_and_test
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.MACOS_SPARKLE_PUBLIC_KEY }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout Release Tag
        run: git checkout "refs/tags/$TAG_NAME"

      - name: Import Signing Certificate
        uses: Apple-Actions/import-codesign-certs@b610f78488812c1e56b20e6df63ec42d833f2d14 # v6.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Validate Release Environment
        run: ./scripts/release/validate_env.sh

      - name: Archive Signed App
        run: ./scripts/release/archive_signed_app.sh

      - name: Export Signed App Artifact
        run: ./scripts/release/export_signed_app.sh

      - name: Upload Signed App Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: proxmoxbar-signed-app
          path: ProxmoxBar.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  package_dmg:
    name: Package DMG
    runs-on: macos-26
    timeout-minutes: 20
    needs:
      - preflight
      - archive_signed_app
    env:
      APP_NAME: ProxmoxBar
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Signed App Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxmoxbar-signed-app
          path: signed_app

      - name: Package DMG
        run: ./scripts/release/package_dmg.sh "signed_app/${APP_NAME}.app.tar.gz"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: proxmoxbar-dmg
          path: ProxmoxBar.dmg
          if-no-files-found: error
          retention-days: 14

  generate_appcast:
    name: Generate Sparkle Appcast
    runs-on: macos-26
    timeout-minutes: 20
    needs:
      - preflight
      - package_dmg
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout Release Tag
        run: git checkout "refs/tags/$TAG_NAME"

      - name: Download DMG Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxmoxbar-dmg
          path: release_dmg

      - name: Prepare DMG Path
        run: cp "release_dmg/${APP_NAME}.dmg" "${APP_NAME}.dmg"

      - name: Generate Appcast
        run: ./scripts/release/generate_appcast.sh "${APP_NAME}.dmg"

      - name: Create Checksum
        run: ./scripts/release/create_checksum.sh "${APP_NAME}.dmg"

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: proxmoxbar-release-bundle
          path: |
            ProxmoxBar.dmg
            release_assets/appcast.xml
            release_assets/ProxmoxBar.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  publish_github_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - preflight
      - generate_appcast
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Release Bundle Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxmoxbar-release-bundle
          path: release_bundle

      - name: Publish Release
        run: ./scripts/release/publish_github_release.sh

  publish_appcast:
    name: Publish Appcast to main and develop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - preflight
      - publish_github_release
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download Release Bundle Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: proxmoxbar-release-bundle
          path: release_bundle

      - name: Commit and Push appcast.xml
        run: ./scripts/release/publish_appcast.sh
